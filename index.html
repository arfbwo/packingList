<style>

t-size:12.5px}

<script>
const KEY="india-pack-v1",MON=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"],DAY=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
let DATES=[];const pad=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),pd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)},nk=s=>String(s).trim().replace(/\s+/g," ").toLowerCase();
function buildDates(){DATES=[];const e=pd(S.end);for(let d=pd(S.start);d<=e;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1))DATES.push({id:iso(d),l:d.getDate()+" "+MON[d.getMonth()],w:DAY[d.getDay()]})}

const PAL=["#f2a65a","#5cc8a1","#6ea8fe","#c792ea","#ef6b6b","#e5c07b"];
let uid=Date.now();const nid=p=>p+(uid++).toString(36);
function seed(){
 const tags=[{id:"t1",name:"Ransel",color:"#6ea8fe"},{id:"t2",name:"Koper",color:"#f2a65a"},{id:"t3",name:"Tas kecil",color:"#5cc8a1"}];
 const S=[["Essential",["Paspor","e-Visa India (print)","Tiket pesawat","Uang tunai & Rupee","Kartu ATM / kredit"]],["Device",["iPhone 12 + charger","Powerbank","Adaptor colokan India","Earphone"]],["Body Care",["Sikat gigi & pasta","Sabun & shampoo","Sunscreen","Hand sanitizer","Tisu basah"]],["Pakaian",["Kemeja","Jeans","Kaos","Jaket tipis","Kaus kaki","Pakaian dalam"]],["Medical",["Oralit & obat diare","Obat pribadi","Masker","Antiseptik & plester","Vitamin"]],["Others",["Botol minum","Gembok koper","Kantong plastik"]]];
 const st={tags,sections:[],items:[],f:"all"};
 S.forEach(([n,its])=>{const s={id:nid("s"),name:n,cl:false};st.sections.push(s);its.forEach(x=>st.items.push({id:nid("i"),sec:s.id,name:x,photo:"",tags:[],dates:[],done:false}))});
 const find=n=>st.items.find(i=>i.name===n);
 [["Paspor","t3"],["Tiket pesawat","t3"],["Powerbank","t1"],["Kemeja","t2"],["Jeans","t2"],["Kaos","t2"]].forEach(([n,t])=>find(n).tags=[t]);
 ["Kemeja","Jeans"].forEach(n=>find(n).dates=["d0"]);
 ["Paspor","e-Visa India (print)","Tiket pesawat"].forEach(n=>find(n).dates=["d0","d11"]);
 return st}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.sections)S=seed();
if(!S.start){S.start="2026-11-29";S.end="2026-12-10"}if(!S.title)S.title="Packing India";
{const b=new Date(2026,10,29),mg=d=>/^d\d+$/.test(d)?iso(new Date(b.getFullYear(),b.getMonth(),b.getDate()+ +d.slice(1))):d;S.items.forEach(i=>i.dates=i.dates.map(mg));S.f=mg(S.f||"all")}
buildDates();if(S.f!=="all"&&!DATES.some(d=>d.id===S.f))S.f="all";
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Penyimpanan penuh, coba hapus beberapa foto",true);return false}if(G.token){G.v=(G.v||0)+1;G.dirty=1;gsave();clearTimeout(PT);PT=setTimeout(gstart,2000);setSY("sync")}return true}
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m,bad){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast "+(bad?"bad":"ok");t.textContent=(bad?"✕ ":"✓ ")+m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
const tagOf=id=>S.tags.find(t=>t.id===id);
function uniq(b){let n=b,k=2;while(S.tags.some(t=>nk(t.name)===nk(n)))n=b+" "+k++;return n}
function dateTxt(a){if(!a.length)return"";if(a.length===DATES.length)return"Semua hari";if(a.length<=2)return[...a].sort().map(i=>(DATES.find(d=>d.id===i)||{l:i}).l).join(", ");return a.length+" hari"}
function render(){
 const vd=i=>S.f==="all"||i.dates.includes(S.f),tf=S.tf||"all",vis=i=>vd(i)&&(tf==="all"||i.tags.includes(tf)),tagFilter=`<button class="chip ${tf==="all"?"on":""}" data-a="tf" data-id="all">Semua tag</button>`+S.tags.map(t=>`<button class="chip ${tf===t.id?"on":""}" data-a="tf" data-id="${t.id}" ${tf===t.id?`style="color:${t.color};border-color:${t.color};background:${t.color}1f"`:""}>${esc(t.name)} ${S.items.filter(i=>vd(i)&&i.tags.includes(t.id)).length}</button>`).join("");
 const all=S.items.filter(vis),dn=all.filter(i=>i.done).length,pct=all.length?Math.round(dn/all.length*100):0;
 let h=`<div class="top"><div class="hd"><div class="tt"><h1 id="ttl" data-a="ttl">${esc(S.title)}</h1><button class="dl" data-a="trip">${rng()} ✎</button></div><button class="ic dots" data-a="menu" aria-label="Menu">⋯</button></div><div class="bar"><i style="width:${pct}%"></i></div><div class="cnt"><span>${dn} dari ${all.length} siap (${pct}%)</span>${G.token?`<button id="sy" data-a="gsync">${syTxt()}</button>`:""}</div></div>
 <div class="stk"><div class="dates"><button class="dc ${S.f==="all"?"on":""}" data-a="flt" data-id="all">Semua<small>${DATES.length} hari</small></button>${DATES.map(d=>`<button class="dc ${S.f===d.id?"on":""}" data-a="flt" data-id="${d.id}">${d.l}<small>${d.w}</small></button>`).join("")}</div><div class="tgf">${tagFilter}</div></div>`;
 S.sections.forEach(s=>{
  const its=S.items.filter(i=>i.sec===s.id&&vis(i));
  h+=`<div class="sec ${s.cl?"cl":""}" data-sid="${s.id}"><div class="sh"><button class="t" data-a="col" data-id="${s.id}">${esc(s.name)}</button><span class="n">${its.filter(i=>i.done).length}/${its.length}</span><button class="ic" data-a="esec" data-id="${s.id}">✎</button><button class="chev ic" data-a="col" data-id="${s.id}">▾</button></div><div class="body">`;
  if(!its.length)h+=`<div class="empty">${S.f==="all"&&tf==="all"?"Belum ada item.":"Tidak ada item untuk filter ini."}</div>`;
  its.forEach(i=>{h+=`<div class="it ${i.done?"dn":""}" data-iid="${i.id}"><button class="ck ${i.done?"on":""}" data-a="tog" data-id="${i.id}">✓</button><button class="th ${i.photo?"has":""}" data-a="ph" data-id="${i.id}" style="${i.photo?`background-image:url(${i.photo})`:""}">${i.photo?"":"+"}</button><button class="mid" data-a="eit" data-id="${i.id}"><div class="nm">${esc(i.name)}</div><div class="meta">${i.tags.map(tagOf).filter(Boolean).map(t=>`<span class="tg" style="color:${t.color};border-color:${t.color}55;background:${t.color}1f">${esc(t.name)}</span>`).join("")}${i.dates.length?`<span class="dm">${dateTxt(i.dates)}</span>`:""}</div></button></div>`});

 $("#app").innerHTML=h}
let D=null,FT=null;
function sheet(html){let o=$("#ov");const first=!o;if(first){o=document.createElement("div");o.id="ov";o.className="ov";document.body.appendChild(o);o.addEventListener("click",e=>{if(e.target===o){if(D&&D.chg)toast("Tag diperbarui");closeS()}})}const old=o.querySelector(".sht"),st=old?old.scrollTop:0;o.innerHTML=`<div class="sht${first?"":" na"}">${html}</div>`;o.querySelector(".sht").scrollTop=st}

function itemSheet(){
 const sec=S.sections.map(s=>`<option value="${s.id}" ${s.id===D.sec?"selected":""}>${esc(s.name)}</option>`).join("");
 sheet(`<h2>${D.isNew?"Item baru":"Edit item"}</h2>
 <div class="row" style="flex-wrap:nowrap"><button class="ph" data-a="${D.photo?"vph":"dph"}" style="${D.photo?`background-image:url(${D.photo})`:""}">${D.photo?"":"📷"}</button><div style="flex:1"><input id="fn" value="${esc(D.name)}" placeholder="Nama item"><div class="row" style="margin-top:8px"><button class="chip" data-a="dph">${D.photo?"Ganti foto":"Tambah foto"}</button>${D.photo?`<button class="chip" data-a="rph">Hapus foto</button>`:""}</div></div></div>
 <label class="lb">Section</label><select id="fs">${sec}</select>
 <label class="lb">Tag</label><div class="row">${S.tags.map(t=>`<button class="chip ${D.tags.includes(t.id)?"on":""}" data-a="dtag" data-id="${t.id}" ${D.tags.includes(t.id)?`style="color:${t.color};border-color:${t.color};background:${t.color}1f"`:""}>${esc(t.name)}</button>`).join("")}<button class="lk" data-a="tags2">Kelola</button></div>
 <label class="lb">Dibawa/dipakai di tanggal <button class="lk" data-a="dall">${D.dates.length===DATES.length?"Kosongkan":"Pilih semua"}</button></label><div class="row">${DATES.map(d=>`<button class="chip ${D.dates.includes(d.id)?"on":""}" data-a="ddt" data-id="${d.id}">${d.l}</button>`).join("")}</div>
 <div class="row" style="margin-top:22px">${D.isNew?"":`<button class="btn dng" data-a="dit">Hapus</button>`}<button class="btn pri" data-a="sit">Simpan</button></div>`)}
function menuSheet(){D={menu:true};sheet(`<h2>Menu</h2><button class="mi" data-a="tags"><span><b>Kelola tag</b><small>Tambah, ubah nama, warna, atau hapus tag</small></span><span>›</span></button><button class="mi" data-a="gh" style="margin-top:10px"><span><b>Sinkronisasi GitHub</b><small>${G.token?"Terhubung ke "+esc(G.repo):"Simpan data di repository GitHub"}</small></span><span>›</span></button>`)}
function tripSheet(){D={trip:true,start:S.start,end:S.end};sheet(`<h2>Ubah tanggal</h2><label class="lb" style="margin-top:0">Tanggal mulai</label><input type="date" id="ts" value="${D.start}"><label class="lb">Tanggal selesai</label><input type="date" id="te" value="${D.end}"><p class="dm" style="margin:12px 0 0">Section dan item tetap aman. Tanggal yang keluar dari rentang baru akan dilepas dari item terkait.</p><div class="row" style="margin-top:20px"><button class="btn pri" data-a="strip">Simpan</button></div>`)}
function saveTrip(){if(!D.start||!D.end){toast("Isi tanggal mulai dan selesai",true);return}const a=pd(D.start),b=pd(D.end),n=Math.round((b-a)/864e5)+1;if(n<1){toast("Tanggal selesai harus setelah tanggal mulai",true);return}if(n>60){toast("Maksimal 60 hari",true);return}const ids=new Set();for(let k=0;k<n;k++)ids.add(iso(new Date(a.getFullYear(),a.getMonth(),a.getDate()+k)));const lost=S.items.filter(i=>i.dates.some(d=>!ids.has(d))).length;
const go=()=>{S.start=D.start;S.end=D.end;buildDates();S.items.forEach(i=>i.dates=i.dates.filter(d=>ids.has(d)));if(S.f!=="all"&&!ids.has(S.f))S.f="all";const r=save();closeS();render();r&&toast(lost?`Tanggal diperbarui, ${lost} item dilepas dari tanggal yang hilang`:"Tanggal diperbarui")};
if(lost)ask("Ubah tanggal?",`${lost} item punya tanggal di luar rentang baru. Tanggal itu akan dilepas dari item, item-nya tetap ada.`,go,"Lanjutkan");else go()}
